<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechStore - Tu Tienda Gamer</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="bg-light">

  
  <header class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm px-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <img src="./assets/logo.svg" alt="TechStore Logo" width="32" height="32" />
        <span class="fw-bold tracking-wide">TechStore</span>
      </a>

      
      <button class="btn btn-outline-light position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas" aria-controls="cartOffcanvas">
        <i class="bi bi-cart3 fs-5"></i>
        <span id="cart-counter" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
          0
        </span>
      </button>
    </div>
  </header>

  <main class="container my-4">
   
    <section class="row g-3 align-items-center mb-4">
      <div class="col-12 col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" id="search-input" class="form-control" placeholder="Buscar producto por nombre..." />
        </div>
      </div>
      <div class="col-12 col-md-6 d-flex flex-wrap gap-2 justify-content-md-end" id="category-filters">
        <button class="btn btn-dark active-filter" data-category="todos">Todos</button>
        <button class="btn btn-outline-dark" data-category="perifericos">Periféricos</button>
        <button class="btn btn-outline-dark" data-category="audio">Audio</button>
        <button class="btn btn-outline-dark" data-category="monitores">Monitores</button>
        <button class="btn btn-outline-dark" data-category="muebles">Muebles</button>
      </div>
    </section>

    
    <div id="loading-spinner" class="text-center my-5 d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mt-2 text-muted">Cargando catálogo...</p>
    </div>

    
    <div id="error-message" class="alert alert-danger d-none text-center" role="alert">
      Hubo un problema al cargar los productos. Por favor intenta de nuevo más tarde.
    </div>

    
    <section class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="products-container">
      
    </section>
  </main>

 
  <footer class="bg-dark text-white text-center py-4 mt-5 border-top border-secondary">
    <div class="container">
      <p class="mb-0 text-white-50 small">
        &copy; 2026 Francisco Kochan – Proyecto Final JavaScript
      </p>
    </div>
  </footer>

  
  <div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title fw-bold" id="cartOffcanvasLabel">Tu Carrito</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    
    <div class="offcanvas-body d-flex flex-column">
      
      <div id="cart-items-container" class="flex-grow-1 overflow-auto pe-2">
        
      </div>

      
      <div class="border-top pt-3 mt-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="fs-5 fw-bold">Total:</span>
          <span class="fs-5 fw-bold text-success" id="cart-total">$0</span>
        </div>
        <div class="d-grid gap-2">
          <button id="checkout-btn" class="btn btn-success fw-bold py-2">
            Finalizar Compra
          </button>
          <button id="clear-cart-btn" class="btn btn-outline-danger btn-sm">
            Vaciar Carrito
          </button>
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
 
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>


  <script src="./js/cart.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
